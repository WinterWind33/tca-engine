name: macOS

# Same triggers as linux.yml; see the comment there.
on:
  push:
    branches-ignore:
      - "release-please--**"
    paths-ignore:
      - ".vscode/*.json"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".clang-format"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Apple Clang only. GCC cannot build the engine on macOS: miniaudio includes Apple's CoreAudio,
  # AudioToolbox and CoreMIDI headers, which use Clang's blocks extension (`^` closures) and
  # Clang-only availability attributes that GCC does not parse. GCC is covered on Linux.
  build-and-test:
    name: macOS / apple-clang / ${{ matrix.build_type }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: command -v ninja > /dev/null || brew install ninja

      # Release-only dependencies, as on Linux: libc++ and libstdc++ each have a single ABI, so the
      # Debug build links them fine.
      - uses: ./.github/actions/build-and-test
        with:
          build-type: ${{ matrix.build_type }}
          triplet: arm64-osx-release
